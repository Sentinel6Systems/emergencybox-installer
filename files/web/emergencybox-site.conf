# EmergencyBox nginx site (installed by the web module to /etc/nginx/sites-available/emergencybox).
# Two servers on port 80:
#  1. the phones' captive checks -> the portal message service (boxportal, 127.0.0.1:8183)
#  2. everything else (box.lan, the IP, anything) -> the box's pages; each part of the box adds
#     its own location blocks as /etc/nginx/emergencybox.d/<name>.conf

server {
    listen 80;
    server_name {{CAPTIVE_HOSTS}};
    server_tokens off;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8183;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 80 default_server;
    server_name {{ADDRESS}} {{HOSTNAME}} {{HOTSPOT_IP}} _;
    server_tokens off;
    root /var/www/emergencybox;
    index index.html;
    client_max_body_size 0;
    location = / { return 302 /box/; }
    location /box/ { try_files $uri $uri/ =404; }
    include /etc/nginx/emergencybox.d/*.conf;
}
