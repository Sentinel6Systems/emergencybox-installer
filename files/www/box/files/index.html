<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e110f">
<title>My files · {{BOX_NAME}}</title>
<link rel="stylesheet" href="../assets/box.css?v={{CSS_VERSION}}">
<style>
/* page-only parts; shared look comes from box.css */
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px;margin:18px 0 4px}
.drv{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);padding:12px 14px;cursor:pointer;min-height:64px}
.drv:hover{border-color:color-mix(in srgb,var(--sig) 55%,var(--line))}
.drv[aria-current=true]{border-color:var(--sig);background:var(--panel2)}
.drv[aria-current=true]::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border:solid var(--sig);border-width:2px 0 0 2px}
.drv svg{width:26px;height:26px;color:var(--sig);grid-row:span 3}
.drv b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drv small{font-size:12.5px;color:var(--muted)}
.drv .meter{margin-top:6px}
.drv.full .meter i{background:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.tools .sp{flex:1}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px;margin:4px 0 8px}
.path button{font:inherit;background:none;border:0;color:var(--sig);cursor:pointer;padding:6px 6px;min-height:36px}
.path button[disabled]{color:var(--ink);cursor:default;font-weight:600}
.path i{color:var(--muted);font-style:normal}
.list{border:1px solid var(--line);background:var(--panel)}
.fr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;min-height:56px}
.fr:last-child{border-bottom:0}
.fr:hover{background:var(--panel2)}
.fr svg{width:24px;height:24px;color:var(--muted);grid-row:span 2}
.fr.dir svg{color:var(--sig)}
.fr b{font-weight:500;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr small{color:var(--muted);font-size:12.5px;grid-column:2}
.fr .more{grid-row:span 2;grid-column:3;color:var(--muted);font-size:20px;padding:0 4px}
.drop{outline:2px dashed var(--sig);outline-offset:4px}
.ups{display:grid;gap:6px;margin:0 0 12px}
.up{border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:14px}
.up div{display:flex;gap:10px}.up div span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up.err{border-color:var(--warn)}.up.err em{color:var(--warn)}
.up em{font-style:normal;color:var(--muted);white-space:nowrap}
.acts-list{display:grid;gap:8px;margin-top:14px}
.acts-list .btn{justify-content:flex-start;width:100%}
.dlg input[type=text]{width:100%;font:inherit;font-size:17px;min-height:48px;padding:0 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dlg input[type=text]:focus{outline:none;border-color:var(--sig)}
#edDlg{max-width:min(900px,calc(100vw - 16px))}
#edText{width:100%;height:min(60vh,560px);font:14px/1.5 ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.pick{max-height:min(45vh,380px);overflow:auto;border:1px solid var(--line);margin-top:10px}
.pick button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 12px;cursor:pointer;min-height:46px}
.pick button:hover{background:var(--panel2)}.pick svg{width:20px;height:20px;color:var(--sig);flex:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--sig);padding:10px 16px;font-size:15px;z-index:20;max-width:calc(100vw - 24px)}
.toast.err{border-color:var(--warn)}
.hint{font-size:13.5px;color:var(--muted);margin:14px 0 0}
@media (max-width:600px){.tools .btn{flex:1 1 calc(50% - 8px);padding:0 10px}.tools .sp{display:none}.fr{padding:9px 10px}}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
 <a class="mark" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><path d="M12 7v10M7 12h10"/></svg>EMERGENCYBOX</a>
 <span class="crumb mono">/ FILES</span>
 <div class="acts"><a class="pwr" href="../index.html">‹ <span>Home</span></a></div>
</div></div>

<main class="wrap">
 <section class="page-head">
  <h1>My files</h1>
  <p class="lede">Keep copies of IDs, insurance papers, photos and contacts here. Plug a USB drive into a black port on the box for more room.</p>
  <div class="drives" id="drives"><p class="note"><span class="spin"></span>Loading…</p></div>
 </section>

 <div class="tools">
  <button class="btn sig" id="bUp" type="button">＋ Upload files</button>
  <button class="btn" id="bDir" type="button">New folder</button>
  <button class="btn" id="bNote" type="button">New note</button>
  <span class="sp"></span>
  <button class="btn hide" id="bEject" type="button">⏏ Eject drive</button>
 </div>
 <input type="file" id="fin" multiple hidden>
 <div class="ups" id="ups"></div>
 <nav class="path" id="path" aria-label="Folder"></nav>
 <div class="list" id="list"></div>
 <p class="hint" id="hint"></p>
 <div style="height:40px"></div>
</main>

<dialog id="fDlg" aria-label="File">
 <div class="dlg">
  <h3 id="fName" style="overflow-wrap:anywhere"></h3>
  <p class="note mono" id="fMeta"></p>
  <div class="acts-list" id="fActs"></div>
  <div class="row"><button class="btn" type="button" data-close>Close</button></div>
 </div>
</dialog>

<dialog id="askDlg" aria-label="Name">
 <form class="dlg" id="askForm" method="dialog">
  <h3 id="askT"></h3>
  <p class="note" id="askN"></p>
  <input type="text" id="askI" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn sig" id="askOk" type="submit">OK</button></div>
 </form>
</dialog>

<dialog id="cfDlg" aria-label="Confirm">
 <div class="dlg">
  <h3 id="cfT"></h3>
  <p id="cfN"></p>
  <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn warn" id="cfOk" type="button">OK</button></div>
 </div>
</dialog>

<dialog id="edDlg" aria-label="Edit">
 <div class="dhead"><h3 id="edT" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h3></div>
 <div style="padding:14px 18px 18px">
  <textarea id="edText" spellcheck="true"></textarea>
  <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn sig" id="edSave" type="button">Save</button></div>
 </div>
</dialog>

<dialog id="pkDlg" class="wide" aria-label="Choose a folder">
 <div class="dlg">
  <h3 id="pkT"></h3>
  <div class="chips" id="pkRoots"></div>
  <nav class="path" id="pkPath"></nav>
  <div class="pick" id="pkList"></div>
  <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn sig" id="pkOk" type="button">Put it here</button></div>
 </div>
</dialog>

<script src="../assets/box.js"></script>
<script>
{
const {$, esc, params, go} = BOX;
const API = '/api/files';
const TEXT = /\.(txt|md|csv|tsv|json|log|ini|conf|cfg|ya?ml|xml|html?|css|js|py|sh|gpx|kml|geojson|vcf|ics|srt)$/i;
const VIEW = /\.(jpe?g|png|gif|webp|bmp|pdf|mp3|m4a|ogg|wav|mp4|webm|txt|md|csv|json)$/i;   // no html/svg: those always download
const IC = {
 my:'<path d="M3 7h6l2 2h10v10H3z"/><path d="M3 7V5h6l2 2"/>',
 usb:'<path d="M9 3h6v6H9z"/><rect x="6" y="9" width="12" height="12" rx="1"/><path d="M10.5 5.5h.01M13.5 5.5h.01"/>',
 dir:'<path d="M3 6h6l2 2h10v11H3z"/>',
 file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
 img:'<rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
 av:'<rect x="3" y="5" width="18" height="14"/><path d="M10 9l5 3-5 3z"/>',
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const kindIc = n => /\.(jpe?g|png|gif|webp|bmp|heic|svg)$/i.test(n) ? 'img' : /\.(mp4|webm|mkv|mov|avi|mp3|m4a|ogg|wav|flac)$/i.test(n) ? 'av' : /\.(pdf|docx?|odt|rtf|txt|md|xlsx?|ods|csv|pptx?)$/i.test(n) ? 'doc' : 'file';
const size = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : n < 1073741824 ? (n/1048576).toFixed(1) + ' MB' : (n/1073741824).toFixed(2) + ' GB';
const when = t => new Date(t * 1000).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
const join = (a, b) => a ? a + '/' + b : b;
const parentOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const q = o => new URLSearchParams(o).toString();

let ROOTS = [], root = 'my', path = '', ITEMS = [], known = null;

async function api(method, act, body, query) {
  const r = await fetch(`${API}/${act}${query ? '?' + q(query) : ''}`, {
    method, cache: 'no-store',
    headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || `The box answered ${r.status}.`);
  return d;
}

let toastT;
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3500);
}

/* ---------- drives ---------- */
function drawDrives() {
  $('drives').innerHTML = ROOTS.map(r => {
    if (r.missing) return `<div class="drv"><span>${svg('my')}</span><b>My files</b><small style="color:var(--warn)">Storage not available. Restart the box.</small></div>`;
    const used = r.total - r.free, pct = r.total ? Math.min(100, used / r.total * 100) : 0;
    return `<button class="drv${pct > 95 ? ' full' : ''}" type="button" data-root="${esc(r.id)}" aria-current="${r.id === root}">
      ${svg(r.kind === 'usb' ? 'usb' : r.kind === 'library' ? 'av' : 'my')}<b>${esc(r.name)}</b>
      <small>${size(r.free)} free of ${size(r.total)}${r.readonly ? ' · read-only' : ''}</small>
      <span class="meter"><i style="width:${pct.toFixed(1)}%"></i></span></button>`;
  }).join('') || '<p class="note">No storage found.</p>';
  const cur = ROOTS.find(r => r.id === root);
  $('bEject').classList.toggle('hide', !(cur && cur.kind === 'usb'));
  const ro = !cur || cur.readonly || cur.missing;
  ['bUp', 'bDir', 'bNote'].forEach(id => $(id).disabled = ro);
  $('hint').textContent = cur && cur.kind === 'usb'
    ? 'Press Eject before you pull the drive out, so nothing is lost.'
    : cur && cur.kind === 'library'
    ? 'Open a folder (Movies, Shows, ...) and upload there. New videos show up in Movies & shows within a minute. H.264 video in .mp4 plays on every device.'
    : 'My files holds up to ' + (cur && cur.total ? size(cur.total) : '5 GB') + '. For more room, plug a USB drive into a black port.';
}

async function loadRoots(first) {
  const d = await api('GET', 'roots');
  const before = new Set(ROOTS.map(r => r.id));
  ROOTS = d.roots;
  if (known && !first) {
    const added = ROOTS.filter(r => r.kind === 'usb' && !before.has(r.id));
    if (added.length) toast(`USB drive "${added[0].name}" connected.`);
  }
  known = true;
  if (!ROOTS.some(r => r.id === root && !r.missing)) {
    if (!first) toast('That USB drive was removed.', true);
    root = 'my'; path = ''; go(new URLSearchParams(), true); await loadList();
  }
  drawDrives();
}

/* ---------- listing ---------- */
function drawPath(el, rid, p, onGo) {
  const r = ROOTS.find(x => x.id === rid);
  const parts = p ? p.split('/') : [];
  const crumbs = [[r ? r.name : rid, '']].concat(parts.map((s, i) => [s, parts.slice(0, i + 1).join('/')]));
  el.innerHTML = crumbs.map(([n, pp], i) => `<button type="button" data-p="${esc(pp)}"${i === crumbs.length - 1 ? ' disabled aria-current="page"' : ''}>${esc(n)}</button>`).join('<i>/</i>');
  el.onclick = e => { const b = e.target.closest('button[data-p]'); if (b && !b.disabled) onGo(b.dataset.p); };
}

async function loadList() {
  $('list').innerHTML = '<p class="note" style="padding:14px"><span class="spin"></span>Loading…</p>';
  try {
    const d = await api('GET', 'list', null, {root, path});
    ITEMS = d.items; path = d.path;
  } catch (e) {
    if (path) { path = ''; go(new URLSearchParams({root}), true); return loadList(); }
    ITEMS = []; $('list').innerHTML = `<p class="empty">${esc(e.message)}</p>`; return;
  }
  drawPath($('path'), root, path, p => open(root, p));
  $('list').innerHTML = ITEMS.length ? ITEMS.map((x, i) => `
    <button class="fr${x.dir ? ' dir' : ''}" type="button" data-i="${i}">
      ${svg(x.dir ? 'dir' : kindIc(x.name))}<b>${esc(x.label || x.name)}</b>
      <small>${x.dir ? 'Folder' : size(x.size)} · ${when(x.mtime)}</small>
      <span class="more" aria-hidden="true">${x.dir ? '›' : '⋯'}</span></button>`).join('')
    : `<p class="empty">${path ? 'This folder is empty.' : 'Nothing here yet. Use “Upload files” to add some.'}</p>`;
}

function open(r, p, replace) {
  root = r; path = p || '';
  const s = new URLSearchParams(); if (root !== 'my') s.set('root', root); if (path) s.set('path', path);
  go(s, replace); drawDrives(); loadList();
}

$('drives').addEventListener('click', e => { const b = e.target.closest('[data-root]'); if (b) open(b.dataset.root, ''); });
$('list').addEventListener('click', e => {
  const b = e.target.closest('.fr'); if (!b) return;
  const x = ITEMS[+b.dataset.i];
  if (x.dir) open(root, join(path, x.name)); else fileMenu(x);
});
addEventListener('popstate', () => { const s = params(); root = s.get('root') || 'my'; path = s.get('path') || ''; drawDrives(); loadList(); });

/* ---------- dialogs ---------- */
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => {
  if (e.target === d || e.target.closest('[data-close]')) d.close();
}));
function ask(title, note, value, okText) {
  return new Promise(res => {
    $('askT').textContent = title; $('askN').textContent = note || ''; $('askI').value = value || ''; $('askOk').textContent = okText || 'OK';
    const d = $('askDlg'); let done = false;
    $('askForm').onsubmit = e => { e.preventDefault(); done = true; d.close(); res($('askI').value.trim()); };
    d.onclose = () => { if (!done) res(null); };
    d.showModal(); const dot = value ? value.lastIndexOf('.') : -1; $('askI').focus(); $('askI').setSelectionRange(0, dot > 0 ? dot : (value || '').length);
  });
}
function confirmBox(title, note, okText) {
  return new Promise(res => {
    $('cfT').textContent = title; $('cfN').textContent = note; $('cfOk').textContent = okText;
    const d = $('cfDlg'); let ok = false;
    $('cfOk').onclick = () => { ok = true; d.close(); };
    d.onclose = () => res(ok); d.showModal();
  });
}
const busy = async (fn, okMsg) => { try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message, true); } await loadList(); loadRoots().catch(() => {}); };

/* ---------- file menu ---------- */
function fileMenu(x) {
  const p = join(path, x.name), cur = ROOTS.find(r => r.id === root), ro = cur && cur.readonly;
  const url = (dl) => `${API}/get?${q({root, path: p, ...(dl ? {dl: 1} : {})})}`;
  $('fName').textContent = x.name;
  $('fMeta').textContent = `${size(x.size)} · ${when(x.mtime)} · ${cur ? cur.name : ''}`;
  const acts = [];
  if (VIEW.test(x.name)) acts.push(`<a class="btn sig" href="${url(false)}" target="_blank" rel="noopener">Open</a>`);
  acts.push(`<a class="btn" href="${url(true)}" download>Download to this device</a>`);
  if (TEXT.test(x.name) && x.size <= 2097152 && !ro) acts.push(`<button class="btn" type="button" data-a="edit">Edit text</button>`);
  acts.push(`<button class="btn" type="button" data-a="copy">Copy to…</button>`);
  if (!ro) acts.push(`<button class="btn" type="button" data-a="move">Move to…</button>`,
                     `<button class="btn" type="button" data-a="ren">Rename</button>`,
                     `<button class="btn" type="button" data-a="del" style="color:var(--warn)">Delete</button>`);
  $('fActs').innerHTML = acts.join('');
  $('fActs').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; $('fDlg').close(); itemAction(b.dataset.a, x); };
  $('fDlg').showModal();
}

async function itemAction(a, x) {
  const p = join(path, x.name);
  if (a === 'ren') {
    const n = await ask('Rename', x.dir ? 'New folder name' : 'New file name', x.name, 'Rename');
    if (n && n !== x.name) busy(() => api('POST', 'rename', {root, path: p, name: n}), 'Renamed.');
  } else if (a === 'del') {
    const ok = await confirmBox(`Delete “${x.name}”?`, x.dir ? 'The folder and everything inside it will be deleted. This can’t be undone.' : 'This can’t be undone.', 'Delete');
    if (ok) busy(() => api('POST', 'delete', {root, path: p}), 'Deleted.');
  } else if (a === 'edit') {
    edit(p, x.name);
  } else if (a === 'copy' || a === 'move') {
    const dest = await pickFolder(a === 'move' ? `Move “${x.name}” to…` : `Copy “${x.name}” to…`, x.dir ? {root, path: p} : null);
    if (!dest) return;
    toast(a === 'move' ? 'Moving…' : 'Copying… large files can take a few minutes.');
    busy(() => api('POST', 'copy', {root, path: p, toRoot: dest.root, toPath: dest.path, move: a === 'move'}), a === 'move' ? 'Moved.' : 'Copied.');
  }
}

/* ---------- folder rows menu (long-press alternative: ⋯ on folders via context) ---------- */
$('list').addEventListener('contextmenu', e => {
  const b = e.target.closest('.fr.dir'); if (!b) return; e.preventDefault();
  folderMenu(ITEMS[+b.dataset.i]);
});
function folderMenu(x) {
  const cur = ROOTS.find(r => r.id === root), ro = cur && cur.readonly;
  $('fName').textContent = x.name; $('fMeta').textContent = 'Folder · ' + when(x.mtime);
  $('fActs').innerHTML = `<button class="btn sig" type="button" data-a="open">Open folder</button><button class="btn" type="button" data-a="copy">Copy to…</button>` +
    (ro ? '' : `<button class="btn" type="button" data-a="move">Move to…</button><button class="btn" type="button" data-a="ren">Rename</button><button class="btn" type="button" data-a="del" style="color:var(--warn)">Delete</button>`);
  $('fActs').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; $('fDlg').close(); b.dataset.a === 'open' ? open(root, join(path, x.name)) : itemAction(b.dataset.a, x); };
  $('fDlg').showModal();
}
// touch: long-press a folder for its menu
{ let t; $('list').addEventListener('touchstart', e => { const b = e.target.closest('.fr.dir'); if (!b) return; t = setTimeout(() => { t = 'fired'; folderMenu(ITEMS[+b.dataset.i]); }, 600); }, {passive: true});
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => $('list').addEventListener(ev, e => { if (t === 'fired' && ev === 'touchend') e.preventDefault(); clearTimeout(t); t = null; })); }

/* ---------- folder picker for copy / move ---------- */
function pickFolder(title, avoid) {
  return new Promise(res => {
    let pr = root, pp = path, ok = false;
    $('pkT').textContent = title;
    const draw = async () => {
      $('pkRoots').innerHTML = ROOTS.filter(r => !r.missing && !r.readonly).map(r => `<button class="chip" type="button" data-r="${esc(r.id)}" aria-pressed="${r.id === pr}">${esc(r.name)}</button>`).join('');
      drawPath($('pkPath'), pr, pp, np => { pp = np; draw(); });
      $('pkList').innerHTML = '<p class="note" style="padding:12px"><span class="spin"></span>Loading…</p>';
      try {
        const d = await api('GET', 'list', null, {root: pr, path: pp});
        const dirs = d.items.filter(i => i.dir && !(avoid && avoid.root === pr && join(pp, i.name) === avoid.path));
        $('pkList').innerHTML = dirs.map(i => `<button type="button" data-n="${esc(i.name)}">${svg('dir')}${esc(i.name)}</button>`).join('') || '<p class="note" style="padding:12px">No folders inside. Press “Put it here” to use this one.</p>';
      } catch (e) { $('pkList').innerHTML = `<p class="note" style="padding:12px">${esc(e.message)}</p>`; }
    };
    $('pkRoots').onclick = e => { const b = e.target.closest('[data-r]'); if (b) { pr = b.dataset.r; pp = ''; draw(); } };
    $('pkList').onclick = e => { const b = e.target.closest('[data-n]'); if (b) { pp = join(pp, b.dataset.n); draw(); } };
    $('pkOk').onclick = () => { ok = true; $('pkDlg').close(); };
    $('pkDlg').onclose = () => res(ok ? {root: pr, path: pp} : null);
    $('pkDlg').showModal(); draw();
  });
}

/* ---------- editor ---------- */
let edPath = null, edNew = false;
async function edit(p, name, isNew) {
  edPath = p; edNew = !!isNew; $('edT').textContent = name; $('edText').value = '';
  if (!isNew) {
    try { $('edText').value = (await api('GET', 'text', null, {root, path: p})).text; }
    catch (e) { toast(e.message, true); return; }
  }
  $('edDlg').showModal(); $('edText').focus();
}
$('edSave').onclick = async () => {
  try {
    await api('POST', 'save', {root, path: edPath, text: $('edText').value, create: edNew});
    edNew = false; $('edDlg').close(); toast('Saved.'); loadList(); loadRoots().catch(() => {});
  } catch (e) { toast(e.message, true); }
};

/* ---------- toolbar ---------- */
$('bDir').onclick = async () => { const n = await ask('New folder', 'Folder name', '', 'Create'); if (n) busy(() => api('POST', 'mkdir', {root, path, name: n}), 'Folder created.'); };
$('bNote').onclick = async () => {
  let n = await ask('New note', 'Name for the note', 'Note.txt', 'Create'); if (!n) return;
  if (!/\.[a-z0-9]{1,5}$/i.test(n)) n += '.txt';
  if (ITEMS.some(i => i.name.toLowerCase() === n.toLowerCase())) { toast('Something with that name is already here.', true); return; }
  edit(join(path, n), n, true);
};
$('bEject').onclick = async () => {
  const cur = ROOTS.find(r => r.id === root); if (!cur) return;
  if (UPQ.length || uploading) { toast('Wait for the uploads to finish first.', true); return; }
  const ok = await confirmBox(`Eject “${cur.name}”?`, 'After this you can safely pull the drive out of the box.', 'Eject');
  if (!ok) return;
  try { await api('POST', 'eject', {root: cur.id}); toast('Safe to remove the USB drive now.'); root = 'my'; path = ''; go(new URLSearchParams(), true); await loadRoots(); loadList(); }
  catch (e) { toast(e.message, true); }
};

/* ---------- uploads (one at a time, with progress) ---------- */
const UPQ = []; let uploading = false;
$('bUp').onclick = () => $('fin').click();
$('fin').onchange = () => { addUploads([...$('fin').files]); $('fin').value = ''; };
const main = document.querySelector('main');
main.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); $('list').classList.add('drop'); } });
main.addEventListener('dragleave', e => { if (!main.contains(e.relatedTarget)) $('list').classList.remove('drop'); });
main.addEventListener('drop', e => { $('list').classList.remove('drop'); if (!e.dataTransfer.files.length) return; e.preventDefault(); if (!$('bUp').disabled) addUploads([...e.dataTransfer.files]); });

function addUploads(files) {
  for (const f of files) {
    const el = document.createElement('div'); el.className = 'up';
    el.innerHTML = `<div><span>${esc(f.name)}</span><em>waiting</em></div><span class="meter"><i></i></span>`;
    $('ups').appendChild(el);
    UPQ.push({f, el, root, path});
  }
  pump();
}
function pump() {
  if (uploading || !UPQ.length) return;
  uploading = true;
  const {f, el, root: r, path: p} = UPQ.shift();
  const em = el.querySelector('em'), bar = el.querySelector('.meter i');
  const x = new XMLHttpRequest();
  x.open('PUT', `${API}/upload?${q({root: r, path: p, name: f.name})}`);
  x.upload.onprogress = e => { if (e.lengthComputable) { const pc = e.loaded / e.total * 100; bar.style.width = pc + '%'; em.textContent = pc < 100 ? pc.toFixed(0) + '%' : 'saving…'; } };
  const end = (msg, err) => {
    em.textContent = msg; if (err) el.classList.add('err'); else setTimeout(() => el.remove(), 2500);
    uploading = false; if (r === root && p === path) loadList(); loadRoots().catch(() => {}); pump();
  };
  x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {}
    if (x.status === 200) end(d.name && d.name !== f.name ? 'saved as ' + d.name : 'done');
    else end(d.error || (x.status === 413 ? 'Too big for the box.' : 'Failed (' + x.status + ')'), true); };
  x.onerror = () => end('Connection lost. Try again.', true);
  em.textContent = '0%';
  x.send(f);
}
addEventListener('beforeunload', e => { if (uploading || UPQ.length) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- start ---------- */
(async () => {
  const s = params(); root = s.get('root') || 'my'; path = s.get('path') || '';
  try { await loadRoots(true); } catch (e) { $('drives').innerHTML = `<p class="note">${esc(e.message)}</p>`; }
  await loadList();
  setInterval(() => { if (!document.hidden) loadRoots().catch(() => {}); }, 3000);
})();
}
</script>
</body>
