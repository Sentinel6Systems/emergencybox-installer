# EmergencyBox: names for devices on the hotspot.
# Read by the dnsmasq that NetworkManager starts for the hotspot (shared mode).
# Installed to /etc/NetworkManager/dnsmasq-shared.d/ by the network module.

# The box's own name: http://{{ADDRESS}}
domain={{DOMAIN}}
local=/{{DOMAIN}}/
address=/{{ADDRESS}}/{{HOTSPOT_IP}}
address=/{{HOSTNAME}}/{{HOTSPOT_IP}}

# Box only: never forward names to the internet, even when Ethernet has it.
# Unknown names fail at once instead of timing out.
no-resolv

# Phones' "is there internet?" checks come to the box, which answers with the
# "connected, open your browser" message (portal module). The network module adds
# one address= line per name in files/network/captive-hosts.list below this line.
