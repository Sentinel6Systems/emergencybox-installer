# EmergencyBox My files (installed to /etc/nginx/emergencybox.d/)
location /api/files/ {
    proxy_pass http://127.0.0.1:8182;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;            # size limits are enforced by free space, not nginx
    proxy_request_buffering off;       # stream uploads straight to disk (Pi RAM is small)
    proxy_read_timeout 3600s;          # big copies to/from USB take a while
    proxy_send_timeout 3600s;
}
# Downloads are handed back to nginx by boxfiles (X-Accel-Redirect); not reachable directly.
location /_boxfiles_my/ {
    internal;
    alias {{MYFILES_DIR}}/;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}
location /_boxfiles_library/ {
    internal;
    alias {{CONTENT_DIR}}/media/;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}
location /_boxfiles_media/ {
    internal;
    alias /media/;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
}
