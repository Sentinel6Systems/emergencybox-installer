# EmergencyBox admin page API (installed to /etc/nginx/emergencybox.d/)
location /api/admin/ {
    proxy_pass http://127.0.0.1:8185;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;            # ZIMs and movies are many GB; free space is checked by the service
    proxy_request_buffering off;       # stream uploads straight to disk (Pi RAM is small)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location /box/admin/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
}
