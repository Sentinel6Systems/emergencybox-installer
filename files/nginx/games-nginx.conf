# EmergencyBox Games (installed to /etc/nginx/emergencybox.d/)
# Pages and EmulatorJS in the web folder; ROMs in the content folder.
location = /games { return 302 /games/; }
location /games/ {
    alias /var/www/emergencybox/games/;
}
location /games/roms/ {
    alias {{CONTENT_DIR}}/games/roms/;
    autoindex on;
    autoindex_format json;
}
